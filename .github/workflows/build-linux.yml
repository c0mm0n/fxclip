name: Build Linux

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: "0.0.0-dev"
        required: false
  push:
    branches: [linux]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      VERSION: ${{ inputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"
      - name: Build bundled wl-clipboard 2.3.0 with ext-data-control
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libwayland-dev pkg-config curl xz-utils cmake libgl-dev qt6-base-dev qt6-qpa-plugins qt6-wayland desktop-file-utils
          bash Linux/scripts/build-wl-clipboard.sh "$PWD/package/libexec"
      - name: Test shared engine on Linux Foundation
        run: swift test --package-path Engine
      - name: Bake version and build static Swift runtime
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['VERSION']
          if not version or any(c not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.+-_' for c in version):
              raise SystemExit('Invalid version')
          Path('Linux/Sources/fxclip/Version.swift').write_text('enum Version { static let value = ' + json.dumps(version) + ' }\n')
          PY
          swift build --package-path Linux -c release --static-swift-stdlib -Xswiftc -gnone -Xswiftc -debug-prefix-map -Xswiftc "$PWD=."
          mkdir -p package
          cp Linux/.build/release/fxclip package/
          strip package/fxclip
          python3 Linux/scripts/sanitize-runtime-paths.py package/fxclip
          cp Shared/rules.json package/fxclip.rules.json
          cmake -S Linux/ui -B Linux/ui/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFXCLIP_VERSION="$VERSION"
          cmake --build Linux/ui/build --parallel
          ctest --test-dir Linux/ui/build --output-on-failure
          cp Linux/ui/build/fxclip-ui package/fxclip-ui
          cp Linux/ui/build/fxclip-icon.png package/fxclip-icon.png
          cp Linux/ui/build/fxclip-tray.png package/fxclip-tray.png
          cmp package/fxclip-icon.png App/Assets.xcassets/AppIcon.appiconset/icon_512x512.png
          cmp package/fxclip-tray.png App/Assets.xcassets/AppIcon.appiconset/icon_32x32@2x.png
          cp Linux/dist/* package/
          chmod +x package/install.sh
          test "$(package/fxclip --version)" = "fxclip $VERSION"
          ldd package/fxclip-ui | grep -q 'libQt6Widgets.so.6'
          QT_QPA_PLATFORM=offscreen package/fxclip-ui --icon-check
          mkdir -p "$RUNNER_TEMP/fxclip-home" "$RUNNER_TEMP/fxclip-config"
          mkdir -p Linux/ui-snapshots
          for page in 0 1 2 3 4; do
            HOME="$RUNNER_TEMP/fxclip-home" XDG_CONFIG_HOME="$RUNNER_TEMP/fxclip-config" QT_QPA_PLATFORM=offscreen FXCLIP_UI_PAGE="$page" FXCLIP_UI_SCREENSHOT="$PWD/Linux/ui-snapshots/page-$page.png" package/fxclip-ui --page-shot
            test -s "Linux/ui-snapshots/page-$page.png"
          done
          if ldd package/fxclip | grep -Ei 'libswift|libFoundation|libdispatch|libBlocksRuntime'; then
            echo 'Unexpected dynamic Swift dependency' >&2
            exit 1
          fi
          if strings package/fxclip | grep -E '/Users/|/home/[^ /]+'; then
            echo 'Unexpected home path in release binary' >&2
            exit 1
          fi
      - name: Test Linux clipboard policy and adapters
        run: |
          swift test --package-path Linux
          export XDG_CONFIG_HOME="$(mktemp -d)"
          test "$(package/fxclip clean 'https://x.com/example/status/123?utm_source=test')" = 'https://x.com/example/status/123'
          test "$(package/fxclip clean 'https://x.com/example/status/123?utm_source=test' --app ORG.TELEGRAM.DESKTOP)" = 'https://fxtwitter.com/example/status/123'
          if XDG_CURRENT_DESKTOP=GNOME package/fxclip 2>gnome.log; then exit 1; fi
          grep -q 'GNOME Wayland does not support' gnome.log
          bash Linux/scripts/test-install.sh "$PWD/package"
          sh -n Linux/dist/install.sh
          bash -n Linux/scripts/e2e.sh
          unit_dir=$(mktemp -d)
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' Linux/dist/fxclip.service > "$unit_dir/fxclip.service"
          systemd-analyze --user verify "$unit_dir/fxclip.service"
      - name: Install headless Wayland tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sway foot dbus-x11 jq fonts-dejavu-core
      - name: End-to-end under headless Sway
        run: FXCLIP_E2E_UI=1 FXCLIP_UI_HELPER_CAPTURE_DIR="$PWD/Linux/ui-snapshots/helper" dbus-run-session -- bash Linux/scripts/e2e.sh "$PWD/package/fxclip"
      - name: Qt controls against a real systemd user service
        run: bash Linux/scripts/ui-service-e2e.sh "$PWD/package" "$PWD/Linux/ui/build/fxclip-ui-service-test" "$PWD/Linux/ui-snapshots/service"
      - name: Build isolated update fixtures (never published)
        run: |
          for version in 1.0.0 1.0.1; do
            fixture="$RUNNER_TEMP/fxclip-update-fixtures/$version"
            mkdir -p "$fixture"
            printf 'enum Version { static let value = "%s" }\n' "$version" > Linux/Sources/fxclip/Version.swift
            swift build --package-path Linux -c release --static-swift-stdlib -Xswiftc -gnone -Xswiftc -debug-prefix-map -Xswiftc "$PWD=."
            cp Linux/.build/release/fxclip "$fixture/fxclip"
            cmake -S Linux/ui -B "$fixture/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DFXCLIP_VERSION="$version" -DFXCLIP_UPDATE_TESTING=ON -DBUILD_TESTING=OFF
            cmake --build "$fixture/build" --parallel
            cp "$fixture/build/fxclip-ui" "$fixture/fxclip-ui"
          done
          if strings package/fxclip-ui | grep -E 'FXCLIP_UPDATE_TEST_(API|FAIL_RELAUNCH|MODE)'; then
            echo 'Updater test hooks leaked into the public package' >&2
            exit 1
          fi
      - name: Real Qt update, systemd restart and rollback
        run: bash Linux/scripts/update-e2e.sh "$PWD/package" "$RUNNER_TEMP/fxclip-update-fixtures" "$PWD/Linux/ui-snapshots/updates"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ui-check
          path: Linux/ui-snapshots/
          if-no-files-found: error
      - name: Package Linux release
        run: |
          mv package fxclip-linux-x86_64
          tar --owner=0 --group=0 --numeric-owner -czf fxclip-linux-x86_64.tar.gz fxclip-linux-x86_64
          archive_dir=$(mktemp -d)
          tar xzf fxclip-linux-x86_64.tar.gz -C "$archive_dir"
          test "$(find "$archive_dir" -mindepth 1 -maxdepth 1 -printf '%f\n')" = fxclip-linux-x86_64
          cd "$archive_dir/fxclip-linux-x86_64"
          for file in fxclip fxclip-ui fxclip-icon.png fxclip-tray.png fxclip.rules.json fxclip.service install.sh README.md libexec/wl-copy libexec/wl-paste libexec/LICENSE.wl-clipboard libexec/wl-clipboard-source.tar.gz; do test -f "$file"; done
          test "$(find . -type f | wc -l)" -eq 12
          for tool in wl-copy wl-paste; do
            test -x "libexec/$tool"
            test "$("libexec/$tool" --version | sed -n "1p")" = "wl-clipboard 2.3.0"
          done
          test -x ./install.sh
          test -x ./fxclip-ui
          test "$(./fxclip --version)" = "fxclip $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: fxclip-linux-x86_64.tar.gz
          if-no-files-found: error

  ext-data-control:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
      - name: Exercise ext-only Sway 1.11 on Fedora 43
        run: |
          tar xzf fxclip-linux-x86_64.tar.gz
          docker run --rm -v "$PWD:/src" -w /src fedora:43 bash -euxo pipefail -c '
            dnf install -y --setopt=install_weak_deps=False sway foot wayland-utils jq dejavu-sans-mono-fonts dbus-daemon gcc wayland-devel wayland-protocols-devel meson ninja-build git diffutils procps-ng findutils which util-linux
            # Fedora gives sway CAP_SYS_NICE; remove it for unprivileged headless
            # Docker and to allow the test-only LD_PRELOAD global filter.
            setcap -r /usr/bin/sway
            sway --version
            rpm -q wlroots
            gcc -shared -fPIC Linux/scripts/ext-only-globals.c -o /tmp/ext-only-globals.so $(pkg-config --cflags --libs wayland-server) -ldl
            git clone --depth 1 --branch v2.2.1 https://github.com/bugaevc/wl-clipboard /tmp/wl-clipboard-2.2.1
            meson setup /tmp/legacy-build /tmp/wl-clipboard-2.2.1 --buildtype=release
            ninja -C /tmp/legacy-build
            useradd -m e2e
            chmod -R a+rX fxclip-linux-x86_64
            runuser -u e2e -- env FXCLIP_E2E_EXT_ONLY=1 FXCLIP_E2E_SWAY_PRELOAD=/tmp/ext-only-globals.so FXCLIP_E2E_LEGACY_WL_PASTE=/tmp/legacy-build/src/wl-paste dbus-run-session -- bash Linux/scripts/e2e.sh /src/fxclip-linux-x86_64/fxclip
          '
