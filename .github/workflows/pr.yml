# Pull requests check all desktop platforms and build/test the Android app.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Test commit attribution policy
        run: python3 -m unittest discover -s tools -p 'test_commit_policy.py'
      - name: Check every commit in the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" > "$RUNNER_TEMP/pr-commits.json"
          python3 tools/check_commit_policy.py "$RUNNER_TEMP/pr-commits.json"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release version policy tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Engine tests
        run: swift test --package-path Engine

      - name: Build the app
        run: tools/make_dmg.sh 0.0.0 0

  linux:
    uses: ./.github/workflows/build-linux.yml

  windows:
    uses: ./.github/workflows/build-windows.yml

  android-updates:
    uses: ./.github/workflows/android-updates.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test engines, history and build APK
        run: ./gradlew :engine:test :app:testReleaseUnitTest :app:testUpdateTestUnitTest :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
