# Every pull request to main must pass the same checks as a release, on every
# platform, before it can be merged (required by the "main: pull requests only" ruleset).
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Engine tests
        run: swift test --package-path Engine

      - name: Build the app
        run: tools/make_dmg.sh 0.0.0 0

  linux:
    uses: ./.github/workflows/build-linux.yml

  windows:
    uses: ./.github/workflows/build-windows.yml

  android:
    uses: ./.github/workflows/build-android.yml
