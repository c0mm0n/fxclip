name: Telegram bot
on:
  pull_request:
    paths: ['Telegram/**', 'Engine/**', 'Shared/**', '.github/workflows/telegram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Engine
      - run: swift test --package-path Telegram
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Telegram/Dockerfile
          load: true
          tags: fxclip-telegram:check
      - run: docker run --rm fxclip-telegram:check --check
