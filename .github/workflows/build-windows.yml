name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: Version to bake into the executable
        type: string
        required: false
        default: "0.0.0-dev"
  push:
    branches: [windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      FXCLIP_VERSION: ${{ inputs.version || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test every shared vector
        run: dotnet test Windows/Fxclip.Engine.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish standalone executable
        run: |
          if ($env:FXCLIP_VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          dotnet publish Windows/Fxclip -c Release -r win-x64 --self-contained true -o Windows/publish "-p:Version=$env:FXCLIP_VERSION" "-p:AssemblyVersion=$numeric" "-p:FileVersion=$numeric" -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Item Windows/publish/fxclip.exe).VersionInfo.FileVersion
          if ($version -ne $numeric) { throw "Unexpected baked-in version: $version" }
      - name: Clipboard end-to-end (best effort)
        id: clipboard
        continue-on-error: true
        run: ./Windows/tools/clipboard-smoke.ps1 -Executable Windows/publish/fxclip.exe
      - name: Capture settings and welcome screens (best effort)
        continue-on-error: true
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'fxclip-ui'
          $capture = Start-Process -FilePath (Resolve-Path Windows/publish/fxclip.exe) -ArgumentList '--capture-ui', (Join-Path $pwd 'Windows/ui-snapshots') -PassThru
          if (!$capture.WaitForExit(30000)) { Stop-Process -Id $capture.Id -Force; throw 'UI capture timed out' }
          if ($capture.ExitCode -ne 0) { throw "UI capture exit code: $($capture.ExitCode)" }
          if ((Get-ChildItem Windows/ui-snapshots -Filter *.png -Recurse).Count -ne 16) { throw 'Missing UI snapshots' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-check
          path: Windows/ui-snapshots/
          if-no-files-found: warn
      - name: Package Windows download
        run: |
          Copy-Item Windows/README.md Windows/publish/README.txt
          Compress-Archive -Path Windows/publish/fxclip.exe,Windows/publish/README.txt -DestinationPath Windows/fxclip-windows-x64.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path Windows/fxclip-windows-x64.zip))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 2 -or 'fxclip.exe' -notin $names -or 'README.txt' -notin $names) { throw 'Unexpected archive contents' }
          } finally { $zip.Dispose() }
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows package: fxclip-windows-x64.zip; version $env:FXCLIP_VERSION; clipboard step outcome: ${{ steps.clipboard.outcome }}."
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Windows/fxclip-windows-x64.zip
          if-no-files-found: error
