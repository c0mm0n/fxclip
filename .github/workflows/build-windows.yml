name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: Version to bake into the executable
        type: string
        required: false
        default: "0.1.0-dev"
  push:
    branches: [windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      FXCLIP_VERSION: ${{ inputs.version || '0.1.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test every shared vector
        run: dotnet test Windows/Fxclip.Engine.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish standalone executable
        run: |
          if ($env:FXCLIP_VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          $numeric = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          dotnet publish Windows/Fxclip -c Release -r win-x64 --self-contained true -o Windows/publish "-p:Version=$env:FXCLIP_VERSION" "-p:AssemblyVersion=$numeric" "-p:FileVersion=$numeric" -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Item Windows/publish/fxclip.exe).VersionInfo.FileVersion
          if ($version -ne $numeric) { throw "Unexpected baked-in version: $version" }
      - name: Clipboard end-to-end (best effort)
        id: clipboard
        continue-on-error: true
        run: ./Windows/tools/clipboard-smoke.ps1 -Executable Windows/publish/fxclip.exe
      - name: Capture settings and welcome screens
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'fxclip-ui'
          $capture = Start-Process -FilePath (Resolve-Path Windows/publish/fxclip.exe) -ArgumentList '--capture-ui', (Join-Path $pwd 'Windows/ui-snapshots') -PassThru
          if (!$capture.WaitForExit(30000)) { Stop-Process -Id $capture.Id -Force; throw 'UI capture timed out' }
          if ($capture.ExitCode -ne 0) { throw "UI capture exit code: $($capture.ExitCode)" }
          if ((Get-ChildItem Windows/ui-snapshots -Filter *.png -Recurse).Count -ne 18) { throw 'Missing UI snapshots' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-check
          path: Windows/ui-snapshots/
          if-no-files-found: warn
      - name: Install pinned Velopack packager
        run: dotnet tool install vpk --tool-path Windows/vpk --version 1.2.161
      - name: Package Windows installer, portable and feed
        run: |
          Copy-Item Windows/README.md Windows/publish/README.txt
          $notes = "release-notes/v$env:FXCLIP_VERSION.md"
          if (!(Test-Path $notes)) { $notes = 'Windows/release-notes.md' }
          ./Windows/vpk/vpk.exe pack --packId io.github.c0mm0n.fxclip --packTitle fxclip --packAuthors c0mm0n --packVersion $env:FXCLIP_VERSION --packDir Windows/publish --mainExe fxclip.exe --icon Windows/Fxclip/Assets/fxclip.ico --releaseNotes $notes --delta None --outputDir Windows/releases --skip-updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Windows/tools/prepare-release.ps1 -Directory Windows/releases
      - name: Real Windows update and failure tests
        run: ./Windows/tools/update-e2e.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-proof
          path: Windows/update-proof/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Windows/releases/*
          if-no-files-found: error
