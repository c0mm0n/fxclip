# Manual (or when this file changes): builds the iOS app and pushes its screenshots to a throwaway branch
# (ios-screens/<run id>), for reviewers who cannot download Actions artifacts.
# Delete the branch once looked at.
name: iOS screenshots

on:
  workflow_dispatch:
  # Also when this file changes, so a new version shows its pictures once.
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/ios-screens.yml']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-ios.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-screens
          path: screens
      - name: Push the screenshots to ios-screens/${{ github.run_id }}
        working-directory: screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS screenshots for ${{ github.sha }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "screens:refs/heads/ios-screens/${{ github.run_id }}"
