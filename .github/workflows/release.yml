# A main push builds and tests all four platforms, then publishes the next release.
# New release-notes/vX.Y.Z.md files select a version; otherwise the patch increments.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.v.outputs.number }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 tools/next_release.py --releases "$RUNNER_TEMP/releases.json" \
            --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  linux:
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.number }}

  windows:
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.number }}

  mac:
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Engine tests
        run: swift test --package-path Engine

      - name: Build DMG
        env:
          FXCLIP_VERSION: ${{ needs.version.outputs.number }}
        run: tools/make_dmg.sh "$FXCLIP_VERSION" "$GITHUB_RUN_NUMBER"

      - name: Sign Mac update feed
        env:
          FXCLIP_VERSION: ${{ needs.version.outputs.number }}
          FXCLIP_SPARKLE_PRIVATE_KEY: ${{ secrets.FXCLIP_SPARKLE_PRIVATE_KEY }}
        run: tools/make_appcast.sh "$FXCLIP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            build/fxclip.dmg
            build/appcast.xml
          if-no-files-found: error

  android:
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing key
        env:
          FXCLIP_ANDROID_KEYSTORE_B64: ${{ secrets.FXCLIP_ANDROID_KEYSTORE_B64 }}
          FXCLIP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FXCLIP_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          encoded = os.environ['FXCLIP_ANDROID_KEYSTORE_B64']
          if not encoded or not os.environ['FXCLIP_ANDROID_KEYSTORE_PASSWORD']:
              raise SystemExit('Android release signing secrets are missing')
          key = Path(os.environ['RUNNER_TEMP']) / 'fxclip-android.p12'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          PYKEY
      - name: Test and build signed APK
        env:
          FXCLIP_ANDROID_KEYSTORE: ${{ runner.temp }}/fxclip-android.p12
          FXCLIP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FXCLIP_ANDROID_KEYSTORE_PASSWORD }}
          FXCLIP_VERSION: ${{ needs.version.outputs.number }}
          FXCLIP_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew :engine:test :app:testReleaseUnitTest :app:assembleRelease --console=plain \
            "-PfxclipVersion=$FXCLIP_VERSION" "-PfxclipVersionCode=$FXCLIP_VERSION_CODE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/fxclip-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/fxclip-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/fxclip-android.apk | grep -F "versionName='$FXCLIP_VERSION'"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fxclip-android.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/dist/fxclip-android.apk
          if-no-files-found: error

  publish:
    needs: [version, mac, linux, windows, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          FXCLIP_RELEASE_TAG_SSH_KEY: ${{ secrets.FXCLIP_RELEASE_TAG_SSH_KEY }}
        run: |
          for file in fxclip.dmg appcast.xml fxclip-windows-x64.zip fxclip-linux-x86_64.tar.gz fxclip-android.apk; do
            test -s "dist/$file" || { echo "::error::Missing release asset: $file"; exit 1; }
          done
          if [ -n "$FXCLIP_RELEASE_TAG_SSH_KEY" ]; then
            trap 'rm -f "$RUNNER_TEMP/fxclip-release-tags" "$RUNNER_TEMP/fxclip-known-hosts"' EXIT
            python3 - <<'PYKEY'
          import os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'fxclip-release-tags'
          key.write_text(os.environ['FXCLIP_RELEASE_TAG_SSH_KEY'] + '\n')
          key.chmod(0o600)
          PYKEY
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/fxclip-known-hosts"
            export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/fxclip-release-tags -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/fxclip-known-hosts -o StrictHostKeyChecking=yes"
            git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG"
          else
            # Explicit tags created by the owner still work without the automation key.
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null || {
              echo "::error::Automatic tag creation requires the dedicated release key and its creation-only ruleset exception."
              exit 1
            }
          fi
          if [ -f "release-notes/$RELEASE_TAG.md" ]; then
            cat "release-notes/$RELEASE_TAG.md" > notes.md
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" --jq .body > notes.md
          fi
          cat release-notes/install.md >> notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file notes.md
