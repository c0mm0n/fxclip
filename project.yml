name: FxClip
options:
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  FxEngine:
    path: Engine
targets:
  FxClip:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - path: App/Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: Shared/rules.json
        buildPhase: resources
    dependencies:
      - package: FxEngine
      - package: Sparkle
    entitlements:
      path: App/FxClip.entitlements
      properties:
        # Ad-hoc signatures have no Apple Team ID: allow the embedded Sparkle framework.
        com.apple.security.cs.disable-library-validation: true
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: fxclip
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: https://github.com/c0mm0n/fxclip/releases/latest/download/appcast.xml
        SUPublicEDKey: VmmGLYGzWJmjCRP4DgwbZ+9bhz4lz432TcwChs2q3JU=
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUSendProfileInfo: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_NAME: fxclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Releases override both from the tag (tools/make_dmg.sh).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.c0mm0n.fxclip
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
