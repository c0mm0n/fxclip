name: FxClip
options:
  deploymentTarget:
    macOS: "13.0"
packages:
  FxEngine:
    path: Engine
targets:
  FxClip:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: Shared/rules.json
        buildPhase: resources
    dependencies:
      - package: FxEngine
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: fxclip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_NAME: fxclip
        PRODUCT_BUNDLE_IDENTIFIER: io.github.c0mm0n.fxclip
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
