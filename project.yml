name: FxClip
options:
  deploymentTarget:
    macOS: "13.0"
packages:
  FxEngine:
    path: Engine
targets:
  FxClip:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: Shared/rules.json
        buildPhase: resources
    dependencies:
      - package: FxEngine
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: fxclip
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_NAME: fxclip
        # Releases override both from the tag (tools/make_dmg.sh).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.c0mm0n.fxclip
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
